<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>남양주시장애인복지관 전자 기탁서</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <strong>남양주시장애인복지관</strong>
      <span>전자 기탁서</span>
    </div>
    <button id="installBtn" class="ghost" hidden>앱 설치</button>
  </header>

  <main>
    <section id="homeView" class="panel home">
      <h1>작성할 기탁서를 선택해 주세요</h1>
      <p>원본 서류 위에 S펜 또는 손가락으로 직접 작성합니다.</p>
      <div class="menu-grid">
        <button class="doc-card" data-type="general"><b>비지정후원금</b><small>비지정후원금 기탁서</small></button>
        <button class="doc-card" data-type="designated"><b>지정후원금</b><small>지정후원금 기탁서</small></button>
        <button class="doc-card" data-type="goods"><b>현물 기탁</b><small>현물 기탁신청서</small></button>
        <button class="doc-card" data-type="cms"><b>CMS 후원</b><small>비지정 기탁서 + CMS 신청서</small></button>
      </div>
      <div class="notice">
        <b>저장 방식</b><br />작성 내용은 GitHub로 전송하지 않습니다. 완료 시 작성된 PDF가 기기에 저장됩니다.
      </div>
    </section>

    <section id="editorView" class="editor" hidden>
      <div class="toolbar">
        <button id="backBtn" class="ghost">← 나가기</button>
        <div class="pager"><button id="prevBtn">‹</button><span id="pageLabel">1 / 1</span><button id="nextBtn">›</button></div>
        <div class="tools">
          <label>펜 굵기 <input id="penSize" type="range" min="1" max="8" value="2" /></label>
          <button id="undoBtn" class="ghost">실행취소</button>
          <button id="clearBtn" class="danger ghost">현재 페이지 지우기</button>
          <button id="saveBtn" class="primary">완료 · PDF 저장</button>
        </div>
      </div>
      <div id="status" class="status">문서를 불러오는 중입니다.</div>
      <div id="pageStage" class="stage-wrap">
        <div id="pageBox" class="page-box">
          <canvas id="pdfCanvas"></canvas>
          <canvas id="inkCanvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
